# Runs on every push and pull request: lint and unit tests.
# The tests use an invented RBI-style page, a fake embedder and a fake LLM,
# so CI needs no documents, no model download and no API key.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" ruff
      - name: Lint
        run: ruff check src tests --select E,F,I,B --line-length 130
      - name: Test
        run: pytest -q
