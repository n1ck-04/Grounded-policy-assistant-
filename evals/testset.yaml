# Evaluation set: 65 questions with known answers.
#
# Each question has:
#   type:   answerable   -> the documents contain the answer
#           unanswerable -> they don't; the assistant must refuse rather than guess
#   gold:   the clause(s) that contain the answer, as doc:clause. A retrieved chunk
#           "covers" a gold clause if it contains that clause or one of its sub-clauses.
#   facts:  what a correct answer must say. Each inner list is one fact, written as
#           alternative phrasings; an answer passes if it contains at least one
#           phrasing of EVERY fact (after normalising case, commas in numbers, % etc.).
#   kind:   lookup (same words as the document) | paraphrase (everyday words) |
#           numeric | table (answer is in a table) | multi (needs two clauses)
#
# Questions were written by reading the documents, deliberately phrased the way a
# customer or a bank employee would ask, not copied from the regulation's wording.

questions:
  # ---------------------------------------------------------------- customer_liability
  - id: cl01
    question: If someone breaches the bank's systems and money is stolen from my account, and I tell the bank within two days, how much of the loss do I have to bear?
    type: answerable
    kind: paraphrase
    gold: [customer_liability:6]
    facts: [[zero, "no liability", "nothing", "not liable"]]
  - id: cl02
    question: What is the most a BSBD account holder can lose per transaction from a third-party breach reported five working days after the bank's alert?
    type: answerable
    kind: table
    gold: [customer_liability:7]
    facts: [["5000"]]
  - id: cl03
    question: A customer with a credit card limit of Rs 8 lakh reports a third-party fraud six working days after being alerted. What is the maximum they can be liable for per transaction?
    type: answerable
    kind: table
    gold: [customer_liability:7]
    facts: [["25000"]]
  - id: cl04
    question: Within how many working days must the bank credit the disputed amount back to the customer's account after the customer reports an unauthorised transaction?
    type: answerable
    kind: numeric
    gold: [customer_liability:9]
    facts: [["10 working days", "ten working days"]]
  - id: cl05
    question: What is the longest a bank can take to resolve a complaint about an unauthorised electronic transaction and settle the customer's liability?
    type: answerable
    kind: numeric
    gold: [customer_liability:10]
    facts: [["90 days", "ninety days"]]
  - id: cl06
    question: In a dispute over an unauthorised electronic transaction, who has to prove that the customer is liable?
    type: answerable
    kind: paraphrase
    gold: [customer_liability:12]
    facts: [["bank"]]
  - id: cl07
    question: I gave my OTP to a caller who then emptied my account. Who bears the loss?
    type: answerable
    kind: paraphrase
    gold: [customer_liability:7]
    facts: [["entire loss", "full loss", "whole loss", "bear the loss", "bears the loss", "bear the entire", "liable for the loss"]]
  - id: cl08
    question: How are the working days counted when deciding a customer's liability for an unauthorised transaction?
    type: answerable
    kind: lookup
    gold: [customer_liability:8]
    facts: [["home branch"]]
  - id: cl09
    question: Can a bank refuse to offer electronic transactions to a customer who hasn't given a mobile number?
    type: answerable
    kind: paraphrase
    gold: [customer_liability:5]
    facts: [["atm"]]
  - id: cl10
    question: Which alerts must banks ask customers to register for, for electronic banking transactions?
    type: answerable
    kind: lookup
    gold: [customer_liability:5]
    facts: [["sms"]]
  - id: cl11
    question: While the bank sorts out an unauthorised debit on my debit card, do I lose the interest on that money?
    type: answerable
    kind: paraphrase
    gold: [customer_liability:10]
    facts: [["loss of interest", "not lose", "won't lose", "will not lose", "does not lose", "doesn't lose", "no loss"]]
  - id: cl12
    question: What happens to my liability if I report a third-party fraud more than seven working days after the bank alerted me?
    type: answerable
    kind: lookup
    gold: [customer_liability:7, customer_liability:8]
    facts: [["board"]]
  - id: cl13
    question: Which committee in a bank periodically reviews the unauthorised electronic banking transactions reported by customers?
    type: answerable
    kind: lookup
    gold: [customer_liability:13]
    facts: [["standing committee on customer service"]]
  - id: cl14
    question: If the fraud happened because of the bank's own negligence, does it matter how late I report it?
    type: answerable
    kind: paraphrase
    gold: [customer_liability:6]
    facts: [["zero"], ["irrespective", "regardless", "does not matter", "doesn't matter", "no matter", "whether or not"]]

