[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded"
version = "0.1.0"
description = "A RAG assistant for RBI regulations that cites the exact clause, refuses when the documents don't say, and is measured with an evaluation harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
